services:
  gateway:
    build:
      context: .
    environment:
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-local-development-key}
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_PROVIDER: ${GATEWAY_PROVIDER:-mock}
      GATEWAY_OPENAI_API_KEY: ${GATEWAY_OPENAI_API_KEY:-}
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-20}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_CACHE_TTL_SECONDS: ${GATEWAY_CACHE_TTL_SECONDS:-300}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
