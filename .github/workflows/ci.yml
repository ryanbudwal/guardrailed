name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests with coverage
        env:
          GATEWAY_REDIS_URL: redis://localhost:6379/0
          GATEWAY_API_KEYS: ci-local-key
          GATEWAY_PROVIDER: mock
        run: pytest --cov-report=term-missing --cov-report=xml

      - name: Build container
        run: docker build --tag guardrailed-gateway:ci .

      - name: Container smoke test
        run: |
          docker run --detach --name gateway-ci --network host \
            -e GATEWAY_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e GATEWAY_API_KEYS=ci-local-key \
            guardrailed-gateway:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs gateway-ci
          exit 1
